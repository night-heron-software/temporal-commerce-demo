# Core infrastructure only — Cassandra, Elasticsearch, Temporal
# Observability stack (Jaeger, Prometheus, Grafana) is opt-in.
# See docker-compose.observability.yml and README for details.

services:
  cassandra:
    image: cassandra:4.1
    container_name: demo-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=demo-cluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - demo-net

  elasticsearch:
    # Bumped 8.15.0 -> 8.19.4: the JDK 22 bundled in 8.15 crashes with SIGILL
    # on newer Apple Silicon (M4/M5, which expose SVE2/SME) under Docker's Apple
    # Virtualization framework. 8.19.x bundles a JDK that disables SVE on macOS.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    container_name: demo-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - demo-net

  # ── Temporal (temporalio/server + one-shot bootstrap sidecars) ──────────────
  # Migrated off the deprecated temporalio/auto-setup image (no 1.31+ tags exist).
  # Schema init runs as one-shot sidecars before the server starts, and the
  # `default` namespace is registered once the server is serving. Server >= 1.31
  # is required for Standalone Activities (ADR-0006); the feature gate itself
  # lives in infra/temporal/dynamicconfig/development-sql.yaml.
  temporal-schema-setup:
    container_name: demo-temporal-schema-setup
    image: temporalio/admin-tools:1.31.1
    depends_on:
      temporal-postgresql:
        condition: service_started
    environment:
      - POSTGRES_SEEDS=temporal-postgresql
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - DB_PORT=5432
      - DBNAME=temporal
    entrypoint: ["/bin/sh", "/scripts/setup-sql-schema.sh"]
    volumes:
      - ./infra/temporal/scripts:/scripts:ro
    networks:
      - demo-net
    restart: on-failure

  temporal-es-setup:
    container_name: demo-temporal-es-setup
    image: curlimages/curl:8.11.1
    depends_on:
      - temporal-elasticsearch
    environment:
      - ES_SEEDS=temporal-elasticsearch
      - ES_PORT=9200
      - ES_SCHEME=http
      - ES_VIS_INDEX=temporal_visibility_v1_dev
    entrypoint: ["/bin/sh", "/scripts/setup-es-index.sh"]
    volumes:
      - ./infra/temporal/scripts:/scripts:ro
      - ./infra/temporal/scripts/es:/es-schema:ro
    networks:
      - demo-net
    restart: on-failure

  temporal:
    image: temporalio/server:1.31.1
    container_name: demo-temporal
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
      temporal-es-setup:
        condition: service_completed_successfully
    ports:
      - "7233:7233"
      - "9464:9464"      # Prometheus metrics endpoint
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v8
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    restart: unless-stopped
    healthcheck:
      # The server image ships nc (no temporal CLI / curl); port-open is the gate.
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - demo-net

  temporal-create-namespace:
    container_name: demo-temporal-create-namespace
    image: temporalio/admin-tools:1.31.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
      - NAMESPACE_RETENTION=24h
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    volumes:
      - ./infra/temporal/scripts:/scripts:ro
    networks:
      - demo-net
    restart: on-failure

  temporal-register-search-attributes:
    container_name: demo-temporal-register-search-attributes
    image: temporalio/admin-tools:1.31.1
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    entrypoint: ["/bin/sh", "/scripts/register-search-attributes.sh"]
    volumes:
      - ./infra/temporal/scripts:/scripts:ro
    networks:
      - demo-net
    restart: on-failure

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: demo-temporal-ui
    depends_on:
      - temporal
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    networks:
      - demo-net

  temporal-postgresql:
    image: postgres:16
    container_name: demo-temporal-postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - demo-net

  temporal-elasticsearch:
    # Bumped 7.17.27 -> 8.19.4 (matched by ES_VERSION=v8 on the temporal service):
    # the JDK bundled in the 7.17 line crashes with SIGILL on newer Apple Silicon
    # (M4/M5) under Docker's Apple Virtualization framework. 8.19.x ships a JDK
    # fixed for macOS.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    container_name: demo-temporal-elasticsearch
    ports:
      - "9201:9200"
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data
    networks:
      - demo-net

volumes:
  cassandra-data:
  es-data:
  temporal-postgres-data:
  temporal-es-data:

networks:
  demo-net:
    driver: bridge
