limit.maxIDLength:
  - value: 255
    constraints: {}
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true # Dev setup only. Please don't turn this on in production.
    constraints: {}
# Enables Standalone Activities (client.activity.execute) — ADR-0006. Requires
# server >= 1.31.0. Disabled by default on the temporalio/server image; without
# this the server returns "Standalone activity is disabled".
activity.enableStandalone:
  - value: true
    constraints: {}
